name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: keebhub_test
          POSTGRES_USER: keebhub
          POSTGRES_PASSWORD: keebhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keebhub -d keebhub_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://keebhub:keebhub@localhost:5432/keebhub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - run: go mod download
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: make sqlc
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: make vet test-integration mod-verify

  documentation-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-install
      - run: make docs-check web-check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: keebhub:ci
